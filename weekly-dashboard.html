<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2주차 학습 대시보드</title>
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --surface-2: #f3f2ec;
    --text: #141413;
    --text-2: #5c5c5a;
    --text-3: #8c8c8a;
    --border: #e5e4df;
    --accent: #534AB7;
    --accent-2: #7F77DD;
    --good: #1D9E75;
    --warn: #D85A30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --surface: #252522;
      --surface-2: #2e2e2a;
      --text: #f5f4ef;
      --text-2: #b4b3ad;
      --text-3: #8c8c8a;
      --border: #3a3a36;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
    padding-bottom: 12px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 20px; font-weight: 500; letter-spacing: -0.02em; }
  h2 { font-size: 15px; font-weight: 500; color: var(--text-2); margin-bottom: 10px; }
  h3 { font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 8px; }
  .week { font-size: 12px; color: var(--text-3); margin-left: 6px; }
  button, input[type=button], input[type=submit] {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); padding: 8px 14px;
    border-radius: 8px; font: inherit; font-size: 13px;
    cursor: pointer; transition: background 0.15s;
  }
  button:hover { background: var(--surface-2); }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.primary:hover { background: #3C3489; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 12px; color: var(--text-3); }
  .status.ok { color: var(--good); }
  .status.warn { color: var(--warn); }
  input[type=text], input[type=number], input[type=time], input[type=password], select, textarea {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; font-size: 14px; width: 100%;
  }
  textarea { resize: vertical; min-height: 50px; }
  section { margin-bottom: 24px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  @media (max-width: 540px) {
    .row3 { grid-template-columns: 1fr 1fr; }
    body { padding: 10px; }
  }
  label { font-size: 11px; color: var(--text-3); display: block; margin-bottom: 3px; }

  .chart-wrap { position: relative; height: 240px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; font-size: 11px; color: var(--text-2); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .books-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .book-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent-2); border-radius: 0 10px 10px 0; padding: 12px 14px; }
  .book-card .name { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
  .book-card .meta { font-size: 11px; color: var(--text-3); margin-bottom: 8px; }
  .progress-track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-bottom: 5px; }
  .progress-bar { height: 100%; transition: width 0.3s; }
  .progress-text { font-size: 11px; color: var(--text-2); display: flex; justify-content: space-between; }

  .session-list { display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow-y: auto; }
  .session-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .session-item .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 6px; }
  .session-item .time { color: var(--text-3); font-size: 11px; }
  .session-item .body { font-size: 12px; color: var(--text-2); }
  .session-empty { color: var(--text-3); font-size: 12px; padding: 16px; text-align: center; border: 1px dashed var(--border); border-radius: 8px; }

  .session-form { display: flex; flex-direction: column; gap: 8px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px;
    border-radius: 8px; font-size: 13px; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; }

  .muted { color: var(--text-3); font-size: 11px; }

  #connectPanel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 16px;
  }
  #connectPanel.hidden { display: none; }
  #connectPanel label { font-size: 12px; color: var(--text-2); margin-top: 8px; }
  #connectPanel .help { font-size: 11px; color: var(--text-3); margin-top: 4px; }

  .sleep-habit { display: flex; gap: 6px; flex-wrap: wrap; }
  .sleep-cell { flex: 1; min-width: 80px; padding: 10px 4px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; user-select: none; background: var(--surface); text-align: center; font-size: 12px; }
  .sleep-cell.good { background: #E1F5EE; color: #04342C; }
  .sleep-cell.bad { background: #FCEBEB; color: #501313; }

  .today-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .today-row { grid-template-columns: 1fr; } }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const PLAN = {
  '소설의기술(쿤데라)': { color: '#A47CB8', total: 100, unit: '%',
    days: { '5/11':25,'5/12':25,'5/13':25,'5/14':25,'5/15':0,'5/16':0,'5/17':0 } },
  '허조그': { color: '#7F77DD', total: 355, unit: 'p', startPage: 240,
    days: { '5/11':60,'5/12':50,'5/13':70,'5/14':60,'5/15':70,'5/16':45,'5/17':0 } },
  '미메시스': { color: '#1D9E75', total: 200, unit: 'p',
    days: { '5/11':40,'5/12':40,'5/13':40,'5/14':40,'5/15':40,'5/16':0,'5/17':0 } },
  '배신당한 유언들(쿤데라)': { color: '#D4537E', total: 100, unit: '%',
    days: { '5/11':0,'5/12':0,'5/13':0,'5/14':0,'5/15':25,'5/16':0,'5/17':0 } },
  '이글턴': { color: '#378ADD', total: 15, unit: 'p', startPage: 37,
    days: { '5/11':0,'5/12':0,'5/13':15,'5/14':0,'5/15':0,'5/16':0,'5/17':0 } },
  '계몽주의 개론': { color: '#D85A30', total: 60, unit: 'p',
    days: { '5/11':0,'5/12':0,'5/13':0,'5/14':0,'5/15':0,'5/16':60,'5/17':0 } }
};
const DAYS = ['5/11','5/12','5/13','5/14','5/15','5/16','5/17'];
const DAY_LABELS = ['월 5/11','화 5/12','수 5/13','목 5/14','금 5/15','토 5/16','일 5/17'];

const today = new Date();
const todayStr = today.toISOString().slice(0,10);

document.getElementById('todayLabel').textContent = `오늘: ${today.getMonth()+1}/${today.getDate()} (${['일','월','화','수','목','금','토'][today.getDay()]})`;
document.getElementById('todayDate').textContent = `${today.getMonth()+1}/${today.getDate()} (${['일','월','화','수','목','금','토'][today.getDay()]})`;

function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? 'var(--text)' : '#A32D2D';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function setStatus(msg, kind='') {
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = 'status ' + kind;
}

// ===== GitHub API client =====
const gh = {
  owner: '', repo: '', token: '',
  shaCache: {},
  setCreds(owner, repo, token) {
    this.owner = owner; this.repo = repo; this.token = token;
    localStorage.setItem('gh_owner', owner);
    localStorage.setItem('gh_repo', repo);
    localStorage.setItem('gh_token', token);
  },
  loadCreds() {
    this.owner = localStorage.getItem('gh_owner') || '';
    this.repo = localStorage.getItem('gh_repo') || '';
    this.token = localStorage.getItem('gh_token') || '';
    return this.owner && this.repo && this.token;
  },
  clearCreds() {
    this.owner = ''; this.repo = ''; this.token = '';
    localStorage.removeItem('gh_owner');
    localStorage.removeItem('gh_repo');
    localStorage.removeItem('gh_token');
    this.shaCache = {};
  },
  async req(method, path, body) {
    const url = `https://api.github.com/repos/${this.owner}/${this.repo}/contents/${path}`;
    const opts = { method, headers: { 'Authorization': `Bearer ${this.token}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(url, opts);
    if (!r.ok && r.status !== 404) {
      const err = await r.text();
      throw new Error(`${r.status} ${err.slice(0,200)}`);
    }
    if (r.status === 404) return { _404: true };
    return r.json();
  },
  b64encode(str) {
    return btoa(unescape(encodeURIComponent(str)));
  },
  b64decode(b64) {
    return decodeURIComponent(escape(atob(b64.replace(/\s/g, ''))));
  },
  async getFile(path) {
    const r = await this.req('GET', path);
    if (r._404) return { exists: false, text: '', sha: null };
    this.shaCache[path] = r.sha;
    return { exists: true, text: this.b64decode(r.content), sha: r.sha };
  },
  async putFile(path, text, message) {
    let sha = this.shaCache[path];
    if (sha === undefined) {
      const cur = await this.getFile(path);
      sha = cur.exists ? cur.sha : null;
    }
    const body = { message: message || `Update ${path}`, content: this.b64encode(text) };
    if (sha) body.sha = sha;
    const r = await this.req('PUT', path, body);
    if (r.content && r.content.sha) this.shaCache[path] = r.content.sha;
    return r;
  }
};

// ===== Parsers =====
function parseSessions(text) {
  const result = [];
  const re = /### (\d{1,2}:\d{2})-(\d{1,2}:\d{2}) \((\d+)분\) — (.+?)\n((?:[ ]*- .+\n?| {2,}.+\n?)+)/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const block = m[5];
    const titleRaw = m[4].trim();
    const actMatch = titleRaw.match(/^(.+?)\s*\[(읽기|정리|쓰기)\]\s*$/);
    const book = actMatch ? actMatch[1].trim() : titleRaw;
    const activity = actMatch ? actMatch[2] : '읽기';
    const progress = (block.match(/- 진행: (.+)/) || [])[1];
    const pageM = (progress || '').match(/p\.(\d+)\s*→\s*p\.(\d+)/);
    const pctM = (progress || '').match(/(\d+)%\s*→\s*(\d+)%/);
    const startPage = pageM ? parseInt(pageM[1]) : (pctM ? parseInt(pctM[1]) : null);
    const endPage = pageM ? parseInt(pageM[2]) : (pctM ? parseInt(pctM[2]) : null);
    const unit = pageM ? 'p' : (pctM ? '%' : 'p');
    const focus = (block.match(/- 집중: (\d)\/5/) || [])[1];
    const memo = (block.match(/- 메모: (.+)/) || [])[1];
    const keywords = (block.match(/- 키워드: (.+)/) || [])[1];
    const reflMatch = block.match(/- 정리:\s*([\s\S]+?)(?=\n- |$)/);
    const reflection = reflMatch ? reflMatch[1].trim() : '';
    result.push({ start: m[1], end: m[2], minutes: m[3], book, activity, progress, focus, memo, keywords, reflection, startPage, endPage, unit, rawBlock: m[0] });
  }
  return result;
}

function parseDailyLog(text) {
  const r = {};
  const m = text.match(/## 일과\n([\s\S]*?)(?=\n## |$)/);
  if (!m) return r;
  ['수면','아침','점심','저녁','운동'].forEach(label => {
    const re = new RegExp(`- \\*\\*${label}\\*\\*:\\s*(.+)`);
    const m2 = m[1].match(re);
    if (m2) r[label] = m2[1].trim();
  });
  return r;
}

// ===== Data ops =====
function dailyFilename() {
  return `${todayStr}.md`;
}

async function loadToday() {
  const path = dailyFilename();
  const f = await gh.getFile(path);
  return { text: f.text || '', sha: f.sha, sessions: parseSessions(f.text || ''), daily: parseDailyLog(f.text || '') };
}

async function appendSession(entry) {
  const path = dailyFilename();
  const cur = await gh.getFile(path);
  let text = cur.text;
  if (!text) {
    const dow = ['일','월','화','수','목','금','토'][today.getDay()];
    text = `# ${todayStr} (${dow}) — 인사이트 로그\n\n## 세션 로그\n\n## 인사이트\n`;
  }
  if (!text.includes('## 세션 로그')) text += '\n## 세션 로그\n';
  const idx = text.indexOf('## 세션 로그') + '## 세션 로그'.length;
  text = text.slice(0, idx) + '\n\n' + entry + text.slice(idx);
  await gh.putFile(path, text, `Add session ${entry.slice(4, 30).trim()}`);
}

async function saveDailyLog() {
  const path = dailyFilename();
  const cur = await gh.getFile(path);
  let text = cur.text;
  if (!text) {
    const dow = ['일','월','화','수','목','금','토'][today.getDay()];
    text = `# ${todayStr} (${dow}) — 인사이트 로그\n\n## 세션 로그\n\n## 인사이트\n`;
  }
  const vals = {};
  ['sleep','morning','lunch','dinner','exercise'].forEach(k => {
    const el = document.getElementById('dl_' + k);
    vals[k] = el ? el.value.trim() : '';
  });
  const labelMap = { sleep: '수면', morning: '아침', lunch: '점심', dinner: '저녁', exercise: '운동' };
  let section = '## 일과\n';
  const keys = Object.keys(vals).filter(k => vals[k]);
  keys.forEach(k => section += `- **${labelMap[k]}**: ${vals[k]}\n`);
  const trimmed = section.trimEnd();
  if (text.match(/## 일과\n[\s\S]*?(?=\n## |$)/)) {
    text = text.replace(/## 일과\n[\s\S]*?(?=\n## |$)/, trimmed);
  } else {
    const h = text.match(/^(# [^\n]*\n+)/);
    if (h) text = h[1] + trimmed + '\n\n' + text.slice(h[1].length);
    else text = trimmed + '\n\n' + text;
  }
  await gh.putFile(path, text, 'Update daily log');
  document.getElementById('dailyStatus').textContent = `✓ 저장됨 (${keys.length}/5)`;
}

// ===== Render =====
function diffMin(start, end) {
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  return (eh*60+em) - (sh*60+sm);
}

function renderLegend() {
  const el = document.getElementById('planLegend');
  el.innerHTML = Object.entries(PLAN).map(([n, p]) => `<span><span class="swatch" style="background:${p.color}"></span>${n} ${p.total}${p.unit}</span>`).join('');
}

let weekChart = null;
function renderPlanChart() {
  const ctx = document.getElementById('weekChart');
  if (weekChart) weekChart.destroy();
  weekChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: DAY_LABELS,
      datasets: Object.entries(PLAN).map(([name, p]) => ({
        label: name, data: DAYS.map(d => p.days[d] || 0),
        backgroundColor: p.color, borderColor: p.color, borderWidth: 0.5, stack: 's'
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { stacked: true, ticks: { autoSkip: false, font: { size: 10 } } },
        y: { stacked: true, beginAtZero: true }
      }
    }
  });
}

const bookPagesRead = {};

let actualChart = null;
async function loadActualAndRender() {
  Object.keys(PLAN).forEach(b => bookPagesRead[b] = 0);
  const data = {};
  for (const day of DAYS) {
    const [m, d] = day.split('/').map(Number);
    const dateStr = `2026-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    try {
      const f = await gh.getFile(`${dateStr}.md`);
      if (!f.exists) continue;
      const sessions = parseSessions(f.text);
      sessions.forEach(s => {
        const dm = (s.progress || '').match(/\(([+-]?\d+)(p|%)\)/);
        const delta = dm ? Math.max(0, parseInt(dm[1])) : 0;
        if (!data[day]) data[day] = {};
        data[day][s.book] = (data[day][s.book] || 0) + delta;
        bookPagesRead[s.book] = (bookPagesRead[s.book] || 0) + delta;
      });
    } catch (e) { /* ignore */ }
  }
  // render
  const ctx = document.getElementById('actualChart');
  if (actualChart) actualChart.destroy();
  actualChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: DAY_LABELS,
      datasets: Object.entries(PLAN).map(([name, p]) => ({
        label: name, data: DAYS.map(d => (data[d] || {})[name] || 0),
        backgroundColor: p.color, borderColor: p.color, borderWidth: 0.5, stack: 's'
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { stacked: true, ticks: { autoSkip: false, font: { size: 10 } } },
        y: { stacked: true, beginAtZero: true }
      }
    }
  });
  let totalActual = 0;
  Object.values(data).forEach(day => Object.values(day).forEach(v => totalActual += v));
  document.getElementById('actualChartNote').textContent = `실제 ${totalActual} / 1050 (${Math.round(totalActual/1050*100)}%)`;
  renderBooks();
}

function renderBooks() {
  const grid = document.getElementById('booksGrid');
  grid.innerHTML = '';
  Object.entries(PLAN).forEach(([name, p]) => {
    const read = bookPagesRead[name] || 0;
    const pct = Math.min(100, Math.round((read / p.total) * 100));
    const card = document.createElement('div');
    card.className = 'book-card';
    card.style.borderLeftColor = p.color;
    card.innerHTML = `
      <div class="name">${name}${p.unit === '%' ? ' <span style="font-size:10px;color:var(--text-3);">(e-book)</span>' : ''}</div>
      <div class="meta">목표 ${p.total}${p.unit}</div>
      <div class="progress-track"><div class="progress-bar" style="width:${pct}%; background:${p.color};"></div></div>
      <div class="progress-text"><span>${read}/${p.total}${p.unit}</span><span>${pct}%</span></div>
    `;
    grid.appendChild(card);
  });
}

function populateBookDropdown() {
  const sel = document.getElementById('sBook');
  sel.innerHTML = Object.keys(PLAN).map(n => `<option value="${n}">${n}</option>`).join('');
}

function getBookUnit(name) { return (PLAN[name] || {}).unit || 'p'; }

function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

async function renderSessions() {
  const list = document.getElementById('sessionList');
  list.innerHTML = '<div class="session-empty">로딩 중...</div>';
  try {
    const { sessions, daily } = await loadToday();
    // daily log
    ['수면','아침','점심','저녁','운동'].forEach(label => {
      const key = { '수면':'sleep','아침':'morning','점심':'lunch','저녁':'dinner','운동':'exercise' }[label];
      const el = document.getElementById('dl_' + key);
      if (el && daily[label]) el.value = daily[label];
    });
    if (sessions.length === 0) {
      list.innerHTML = '<div class="session-empty">아직 세션 없음</div>';
    } else {
      list.innerHTML = '';
      sessions.forEach(s => {
        const colors = { '읽기':'#7F77DD','정리':'#1D9E75','쓰기':'#D85A30' };
        const c = colors[s.activity] || '#7F77DD';
        const e = (t) => (t||'').replace(/</g,'&lt;');
        const d = document.createElement('div');
        d.className = 'session-item';
        d.innerHTML = `
          <div class="head">
            <span style="font-weight:500;">
              <span style="display:inline-block;padding:1px 6px;font-size:10px;background:${c};color:white;border-radius:3px;margin-right:4px;">${s.activity}</span>${e(s.book)}
            </span>
            <span class="time">${s.start}-${s.end} (${s.minutes}분)</span>
          </div>
          <div class="body">${s.progress ? e(s.progress)+' · ' : ''}집중 ${s.focus||'-'}/5${s.keywords?' · 🔑 '+e(s.keywords):''}${s.memo?' · '+e(s.memo):''}</div>
          ${s.reflection ? `<div style="margin-top:6px;padding:6px 8px;background:var(--surface-2);border-left:2px solid ${c};border-radius:0 4px 4px 0;font-size:12px;white-space:pre-wrap;">${e(s.reflection)}</div>` : ''}
        `;
        list.appendChild(d);
      });
    }
  } catch (e) {
    list.innerHTML = `<div class="session-empty">오류: ${e.message}</div>`;
  }
}

function renderSleepHabit() {
  const row = document.getElementById('sleepHabitRow');
  const stats = document.getElementById('sleepHabitStats');
  row.innerHTML = '';
  const labels = ['월','화','수','목','금','토','일'];
  let good = 0, bad = 0, checked = 0;
  DAYS.forEach((d, i) => {
    const key = `sleep_phone:${d}`;
    const state = localStorage.getItem(key) || 'none';
    if (state === 'good') good++; if (state === 'bad') bad++;
    if (state !== 'none') checked++;
    const cell = document.createElement('div');
    cell.className = 'sleep-cell ' + (state === 'good' ? 'good' : state === 'bad' ? 'bad' : '');
    const sym = state === 'good' ? '✗' : state === 'bad' ? '✓' : '○';
    cell.innerHTML = `<div style="font-size:10px;color:var(--text-3);">${labels[i]} ${d}</div><div style="font-size:18px;">${sym}</div>`;
    cell.addEventListener('click', () => {
      const seq = ['none','good','bad'];
      const next = seq[(seq.indexOf(state) + 1) % seq.length];
      if (next === 'none') localStorage.removeItem(key); else localStorage.setItem(key, next);
      renderSleepHabit();
    });
    row.appendChild(cell);
  });
  stats.textContent = `${checked}/7 · 안 들고감 ${good} · 들고감 ${bad}`;
}

// Daily log autosave on blur
['sleep','morning','lunch','dinner','exercise'].forEach(k => {
  const el = document.getElementById('dl_' + k);
  el.addEventListener('blur', async () => {
    document.getElementById('dailyStatus').textContent = '저장 중...';
    try { await saveDailyLog(); } catch (e) { document.getElementById('dailyStatus').textContent = '저장 실패: ' + e.message; }
  });
});

// Session form interactions
document.getElementById('sFocus').addEventListener('input', e => {
  document.getElementById('sFocusVal').textContent = e.target.value;
});
document.getElementById('sBook').addEventListener('change', e => {
  const unit = getBookUnit(e.target.value);
  const sl = document.getElementById('sStartLabel');
  const el = document.getElementById('sEndLabel');
  if (unit === '%') { sl.textContent = '시작 %'; el.textContent = '종료 %'; }
  else { sl.textContent = '시작 페이지'; el.textContent = '종료 페이지'; }
});

document.getElementById('saveSession').addEventListener('click', async () => {
  const btn = document.getElementById('saveSession');
  btn.disabled = true;
  try {
    const book = document.getElementById('sBook').value;
    const activity = document.getElementById('sActivity').value;
    const start = document.getElementById('sStart').value;
    const end = document.getElementById('sEnd').value;
    const spRaw = document.getElementById('sStartPage').value;
    const epRaw = document.getElementById('sEndPage').value;
    const focus = document.getElementById('sFocus').value;
    const keywords = document.getElementById('sKeywords').value.trim();
    const memo = document.getElementById('sMemo').value.trim();
    const reflection = document.getElementById('sReflection').value.trim();
    if (!start || !end) { toast('시각 필수', false); btn.disabled = false; return; }
    const minutes = diffMin(start, end);
    if (minutes <= 0) { toast('시간 이상', false); btn.disabled = false; return; }
    const unit = getBookUnit(book);
    const isWrite = activity === '쓰기';
    const hasPages = epRaw !== '';
    if (!isWrite && !hasPages) { toast('종료 페이지 필수', false); btn.disabled = false; return; }
    let progressLine = '';
    let delta = 0;
    if (hasPages) {
      const ep = Number(epRaw);
      const sp = spRaw === '' ? ep : Number(spRaw);
      delta = ep - sp;
      progressLine = unit === '%'
        ? `- 진행: ${sp}% → ${ep}% (${delta>=0?'+':''}${delta}%)\n`
        : `- 진행: p.${sp} → p.${ep} (${delta>=0?'+':''}${delta}p)\n`;
    }
    const reflBlock = reflection
      ? `- 정리:\n${reflection.split('\n').map(l => '  ' + l).join('\n')}\n`
      : '';
    const entry = `### ${start}-${end} (${minutes}분) — ${book} [${activity}]\n` +
      progressLine + `- 집중: ${focus}/5\n` +
      (keywords ? `- 키워드: ${keywords}\n` : '') +
      (memo ? `- 메모: ${memo}\n` : '') + reflBlock;
    await appendSession(entry);
    document.getElementById('sEndPage').value = '';
    document.getElementById('sStartPage').value = '';
    document.getElementById('sMemo').value = '';
    document.getElementById('sKeywords').value = '';
    document.getElementById('sReflection').value = '';
    document.getElementById('sStart').value = end;
    document.getElementById('sEnd').value = nowTime();
    toast('세션 저장됨');
    await renderSessions();
    await loadActualAndRender();
    // feedback
    const fb = document.getElementById('feedbackBox');
    let msg = '';
    if (Number(focus) >= 5) msg = '집중 5/5 — 최고. 어떤 컨디션이었는지 메모해두면 재현 가능.';
    else if (Number(focus) === 4) msg = '집중 4/5 — 안정적인 세션.';
    else if (Number(focus) === 3) msg = '집중 3/5 — 일단 했으면 충분. 부분 달성도 1급 시민.';
    else msg = `집중 ${focus}/5 — 환경 한번 점검.`;
    if (delta >= 30) msg += ` ${delta}${unit==='%'?'%':'p'} — 한 호흡 잘 가셨네요.`;
    else if (delta >= 5) msg += ` ${delta}${unit==='%'?'%':'p'} — 누적이 자산.`;
    else if (delta > 0) msg += ` ${delta}${unit==='%'?'%':'p'} — 작아도 시작했다는 게 가치.`;
    if (reflection.length > 30) msg += ' 정리까지 채우셨네요 — 글쓰기 자료로 그대로 남습니다.';
    fb.textContent = msg;
    fb.style.display = 'block';
  } catch (e) {
    toast('저장 실패: ' + e.message, false);
  } finally {
    btn.disabled = false;
  }
});

// Connect
document.getElementById('connectBtn').addEventListener('click', async () => {
  const owner = document.getElementById('ghOwner').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const token = document.getElementById('ghToken').value.trim();
  if (!owner || !repo || !token) { toast('모든 필드 필수', false); return; }
  gh.setCreds(owner, repo, token);
  await connect();
});

async function connect() {
  setStatus('연결 중...');
  try {
    // test access
    await gh.req('GET', 'README.md');
    setStatus('연결됨: ' + gh.owner + '/' + gh.repo, 'ok');
    document.getElementById('connectPanel').classList.add('hidden');
    document.getElementById('mainContent').style.display = 'block';
    document.getElementById('reloadBtn').disabled = false;
    document.getElementById('logoutBtn').disabled = false;
    renderLegend();
    renderPlanChart();
    populateBookDropdown();
    document.getElementById('sBook').dispatchEvent(new Event('change'));
    document.getElementById('sStart').value = nowTime();
    document.getElementById('sEnd').value = nowTime();
    renderSleepHabit();
    await renderSessions();
    await loadActualAndRender();
  } catch (e) {
    setStatus('연결 실패', 'warn');
    toast('오류: ' + e.message + ' (token/owner/repo 확인)', false);
    gh.clearCreds();
  }
}

document.getElementById('reloadBtn').addEventListener('click', async () => {
  await renderSessions();
  await loadActualAndRender();
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  gh.clearCreds();
  location.reload();
});

// Boot
(async () => {
  if (gh.loadCreds()) {
    document.getElementById('ghOwner').value = gh.owner;
    document.getElementById('ghRepo').value = gh.repo;
    document.getElementById('ghToken').value = gh.token;
    await connect();
  }
})();
</script>
